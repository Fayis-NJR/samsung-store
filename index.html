<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - PROSEVO</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }

    .contact-container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 40px;
      max-width: 800px;
      margin: auto;
      margin-top: 10%;
      display: flex;
      justify-content: space-between;
      border-radius: 10px;
    }

    .info, .form {
      width: 48%;
    }

    .info p, .info a {
      margin: 10px 0;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
    }

    .submit-btn {
      padding: 10px 20px;
      background-color: #f4a300;
      border: none;
      border-radius: 5px;
      color: black;
      cursor: pointer;
    }

    .submit-btn:hover {
      background-color: #d98e00;
    }
  </style>
</head>
<body style="background-image: url(	https://lh3.googleusercontent.com/p/AF1QipNrCDGu7wMOqYoRArXbfZoqlpddUSRsTjcUPqI=s1360-w1360-h1020);">
  <div class="contact-container">
    <div class="info">
      <h2>Contact Us</h2>
      <p>Cheerangan Tower, Zudio Building, 1st Floor, Opp. Maatti Juma Masjid,<br> Vengara, Kerala 676304</p>
      <p>Phone: +91 98958 93089</p>
      <p>Alt: +91 88915 41188</p>
      <p>Email: <a href="contact@prosevo.com">contact@prosevo.com</a></p>
    </div>
    <div class="form">
      <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea placeholder="Your Message" rows="4" required></textarea>
        <div style="margin-bottom:10px;">
          <input type="checkbox" required> Verify you are human
        </div>
        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </div>
  </div>
</body>
</html>
